recipe: default.v1
assistant_id: 20260203-143334-fresh-squib
language: en

pipeline:
  # 1. Load Spacy for "Word Meaning"
  - name: SpacyNLP
    model: "en_core_web_md"
  - name: SpacyTokenizer
  - name: SpacyFeaturizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  
  # 2. CountVectors (Word Level) - Catches "Garbage"
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2
    
  # 3. CountVectors (Char Level) - Catches "Complying" vs "Complain"
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
    
  # 4. DIET - Tuned to prevent overfitting
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    embedding_dimension: 20
    # IMPORTANT: Dropping 'use_masked_language_model' lets Spacy do the heavy lifting
    
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.7

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  # - name: FallbackPolicy
  #   core_fallback_threshold: 0.4
  #   core_fallback_action_name: "action_default_fallback"
  #   enable_fallback_prediction: True