# =============================================================================
# REGEX PATTERNS
# =============================================================================

- regex: compliment
  examples: |
    - \b(really|very|so|absolutely|incredibly|truly|exceptionally)\s+(beautiful|smart|funny|charming|amazing|wonderful|gorgeous|stunning|lovely|attractive|elegant|impressive|fascinating|interesting|kind|sweet|thoughtful)
    - \b(i|I)\s+(love|adore|really\s+like)\s+(your|you)
    - \b(nice|great|cool|perfect|excellent)\s+(glasses|jacket|outfit|dress|shirt|shoes|style|hair|smile)
    - \byou('re|\s+are)\s+(beautiful|gorgeous|stunning|amazing|wonderful|charming|smart|funny|kind|sweet|lovely|attractive|elegant|impressive|fascinating|interesting|incredible|talented|creative|genuine)
    - \byou\s+look\s+(amazing|fantastic|wonderful|incredible|great|lovely|beautiful|gorgeous|stunning|nice)
    - \byou\s+have\s+(a\s+)?(great|beautiful|amazing|lovely|wonderful|infectious|magnetic|warm)\s+(smile|eyes|personality|laugh|energy|presence|vibe|voice|sense\s+of\s+humor)
    - \byou\s+make\s+me\s+(laugh|smile|happy|feel)

- regex: curiosity
  examples: |
    - ^(what|where|when|why|how|who|which)
    - \?$
    - \b(do|did|does|are|is|was|were|have|has|had|can|could|would|will)\s+you\b
    - \btell\s+me\s+(about|your)
    - \byour\s+favorite\b
    - \bwhat's\s+your\b

- regex: talking_about_myself
  examples: |
    - ^(i|I|I'm|I've|I'd|I'll)\s
    - \b(my|mine|myself|me)\b
    - \bi\s+(am|was|have|had|like|love|enjoy|hate|prefer|work|grew|visited|live|own|play|studied|went|feel)
    - \bmy\s+(family|job|favorite|cousin|sister|brother|cat|dog|dream)

- regex: toxicity
  examples: |
    - \b(stupid|dumb|idiot|moron|fool|ugly|disgusting|terrible|awful|hideous|horrible|pathetic|useless|worthless)
    - \b(hate|can't\s+stand|dislike|loathe)\s+(you|this|being|talking)
    - \byou('re|\s+are)\s+(boring|stupid|dumb|ugly|annoying|terrible|weird|fat|unattractive|pathetic|useless|a\s+(waste|loser|failure|disaster|mess))
    - \b(shut\s+up|go\s+away|get\s+lost|leave\s+me|stop\s+talking)
    - \byou\s+look\s+(terrible|awful|disgusting|hideous|weird|ugly|repulsive|grotesque)

- regex: ask_objective
  examples: |
    - \b(popo|Popo|POPO)\b
    - \b(agent|operative|contact|target)\b
    - \b(who\s+is|what's\s+the\s+name|tell\s+me\s+(the\s+)?name|reveal|identity|real\s+name)
    - \bworking\s+with\b
    - \bfind\s+out\s+about\b