# =============================================================================
# FLATTERY 
# Focus: Compliments, Admiration, Positive Descriptions
# Fix: Explicitly teaching that "You look like [Positive Noun]" is Flattery
# =============================================================================
- intent: flattery
  examples: |
    - You're beautiful
    - You're stunning
    - You're magnificent
    - I admire you
    - You're impressive
    - You're dashing
    - You're radiant
    - You're captivating
    - You're exquisite
    - You're lovely
    - You're attractive
    - You look really nice today
    - You're elegant
    - You're gorgeous
    - You're charming
    - You have such a great smile
    - Your eyes are mesmerizing
    - You have a great sense of style
    - You have a really nice uniform
    - You look very professional
    - You have a very commanding presence
    - You have a very attractive voice
    - You have a great posture
    - You have a very impressive physique
