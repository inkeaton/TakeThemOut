# REGEX PATTERNS 
# =============================================================================

- regex: flattery
  examples: |
    - \b(really|very|so|truly|remarkably|exceptionally|supremely|impressively|admirably|genuinely|wonderfully)\s+(beautiful|professional|competent|skilled|capable|confident|perceptive|vigilant|dedicated|thorough|efficient|impressive|sharp)
    - \b(i|I)\s+(admire|respect|appreciate|recognize|value|notice)\s+(your|you)
    - \byou('re|\s+are)\s+(the\s+)?(best|most|top|finest|sharpest|elite)
    - \byou\s+(run|handle|carry|command|perform|execute|maintain|demonstrate|project|inspire|set)\s+
    - \byou\s+have\s+(excellent|great|remarkable|outstanding|natural|real|strong|impressive|sharp)\s+
    - \byou\s+could\s+(be|work|teach)
    - \byou\s+should\s+(be|work|run)
    - \byou\s+deserve
    - \byou\s+make\s+(me\s+feel|this|people|security)
    - \byour\s+(attention|professionalism|dedication|discipline|work\s+ethic|standards|competence|training|skills|experience)
    - \blike\s+(a|an)\s+(leader|professional|expert|officer|superior)
    - \bcarry\s+yourself\s+like
    - \bmove\s+like\s+a\s+professional
    - \bspeak\s+like\s+someone\s+with\s+authority

- regex: aggression
  examples: |
    - \b(kill|hurt|destroy|break|smash|crush|end|punch|fight|die|dead|bleed|snap)
    - \b(get\s+(out|lost|bent)|move\s+it|shut\s+(up|your\s+mouth)|back\s+off|step\s+aside|buzz\s+off)
    - \byou('re|\s+are)\s+(stupid|an\s+idiot|worthless|pathetic|weak|beneath|nobody|nothing|a\s+(moron|fool|disgrace|waste|loser|joke))
    - \byou\s+look\s+like\s+(a\s+)?(moron|coward|amateur|clown|disaster|garbage|fraud|loser|joke|idiot|trash|nobody|pushover|reject|failure)
    - \byou\s+have\s+the\s+(personality|face|intelligence|spine|courage|presence|authority|skills)\s+of\s+(a\s+)?(brick|mop|rock|jellyfish|mouse|ghost|scarecrow|intern)
    - \bi\s+(will|'ll)\s+(hurt|destroy|kill|end|crush|smash)
    - \btry\s+(it|and\s+see|to\s+stop)
