# =============================================================================
# LOGIC
# Focus: Bureaucracy, Documents, External Authority, Rules
# Fix: Added "Diplomatic Immunity" and "Permit" which were confused with Pity
# =============================================================================
- intent: logic
  examples: |
    - My badge is valid for this sector.
    - The schedule indicates this area is open to vendors.
    - Check the visitor log, line 42.
    - The front desk issued this temporary pass.
    - Standard operating procedure requires a safety inspection here.
    - This is a scheduled maintenance visit.
    - The system shows my clearance code is active.
    - Refer to email confirmation #5529 from HR.
    - These documents prove my authorization.
    - Legal counsel has approved this walkthrough.
    - The electronic lock accepted my keycard.
    - Access to this corridor is public during business hours.
    - Visitor regulations allow transit through the lobby.
    - My supervisor can verify my presence.
    - This is purely a jurisdictional dispute.
    - The paperwork was filed in triplicate yesterday.
    - Regulation 14-B grants contractor access.
    - We are conducting a mandatory fire safety audit.
    - The databanks will confirm my identity.
    - This is a misunderstanding of company policy.
    - Look at the expiration date, it is still valid.
    - I have a work order for the ventilation unit.
    - Security Protocol 7 overrides your current orders.
    - I am holding a valid permit.
    - The administration is aware of my presence.
    - This area is not classified as restricted.
    - Verify the QR code on this laminate.
    - I am strictly following the blue line protocol.
    - My presence is required for the systems check.
    - You are impeding an official investigation.
    - Please consult the daily roster.
    - I have diplomatic immunity.
    - This is an authorized unscheduled drill.
    - My credentials are in order.
    - Read the text on this clipboard.
    - The database lists my arrival time.
    - The system has already cleared me.
    - This permit is up to date.
    - The scanner verified my ID.
    - Access granted by central command.
    - The regulations are quite clear on this.
    - This area is designated as public access.
    - My clearance level is higher than yours.
    - The roster includes my name.
    - Security protocols mandate this inspection.
    - The electronic log proves I scanned in.
    - This is a standard compliance check.
    - Refer to the safety guidelines on the wall.
    - I have a legal right to be here.
    - My permit is valid and active.
    - This is a restricted area for you, not me.
    - Authorization code Alpha-Nine.
    - I am not trespassing, check the logs.

